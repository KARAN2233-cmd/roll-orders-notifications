- name: Inject secrets into files
        run: |
          python3 << 'PYEOF'
          import os, sys
          replacements = {
            'PASTE_API_KEY':        os.environ['FIREBASE_API_KEY'],
            'PASTE_AUTH_DOMAIN':    os.environ['FIREBASE_AUTH_DOMAIN'],
            'PASTE_PROJECT_ID':     os.environ['FIREBASE_PROJECT_ID'],
            'PASTE_STORAGE_BUCKET': os.environ['FIREBASE_STORAGE_BUCKET'],
            'PASTE_SENDER_ID':      os.environ['FIREBASE_MESSAGING_SENDER_ID'],
            'PASTE_APP_ID':         os.environ['FIREBASE_APP_ID'],
            'PASTE_VAPID_KEY':      os.environ['FIREBASE_VAPID_KEY'],
            'PASTE_GAS_URL':        os.environ['GAS_URL'],
          }

          # Fail fast if any secret is empty
          for key, val in replacements.items():
            if not val or val.strip() == '':
              print(f'ERROR: Secret for {key} is empty!', flush=True)
              sys.exit(1)

          for fname in ['index.html', 'firebase-messaging-sw.js']:
            with open(fname, 'r') as f:
              content = f.read()
            original = content
            for placeholder, value in replacements.items():
              content = content.replace(placeholder, value)
            # Verify replacements actually happened
            remaining = [p for p in replacements if p in content]
            if remaining:
              print(f'ERROR: Placeholders still found in {fname}: {remaining}', flush=True)
              sys.exit(1)
            with open(fname, 'w') as f:
              f.write(content)
            print(f'Done: {fname}')
          PYEOF
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_VAPID_KEY:           ${{ secrets.FIREBASE_VAPID_KEY }}
          GAS_URL:                      ${{ secrets.GAS_URL }}
