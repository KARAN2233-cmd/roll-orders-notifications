name: Check Secrets Configuration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase Secrets
        run: |
          echo "Checking if all required Firebase secrets are configured..."
          
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ FIREBASE_API_KEY is not set"
            exit 1
          else
            echo "✓ FIREBASE_API_KEY is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ FIREBASE_AUTH_DOMAIN is not set"
            exit 1
          else
            echo "✓ FIREBASE_AUTH_DOMAIN is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ FIREBASE_PROJECT_ID is not set"
            exit 1
          else
            echo "✓ FIREBASE_PROJECT_ID is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ FIREBASE_STORAGE_BUCKET is not set"
            exit 1
          else
            echo "✓ FIREBASE_STORAGE_BUCKET is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ FIREBASE_MESSAGING_SENDER_ID is not set"
            exit 1
          else
            echo "✓ FIREBASE_MESSAGING_SENDER_ID is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_APP_ID }}" ]; then
            echo "❌ FIREBASE_APP_ID is not set"
            exit 1
          else
            echo "✓ FIREBASE_APP_ID is configured"
          fi
          
          if [ -z "${{ secrets.FIREBASE_VAPID_KEY }}" ]; then
            echo "❌ FIREBASE_VAPID_KEY is not set"
            exit 1
          else
            echo "✓ FIREBASE_VAPID_KEY is configured"
          fi
          
          if [ -z "${{ secrets.GAS_URL }}" ]; then
            echo "❌ GAS_URL is not set"
            exit 1
          else
            echo "✓ GAS_URL is configured"
          fi
          
          echo ""
          echo "✅ All required secrets are configured!"
