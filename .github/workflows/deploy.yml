name: Deploy Roll Orders Notifications
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into files
        run: |
          sed -i "s|PASTE_API_KEY|$FIREBASE_API_KEY|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_AUTH_DOMAIN|$FIREBASE_AUTH_DOMAIN|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_PROJECT_ID|$FIREBASE_PROJECT_ID|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_STORAGE_BUCKET|$FIREBASE_STORAGE_BUCKET|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_SENDER_ID|$FIREBASE_MESSAGING_SENDER_ID|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_APP_ID|$FIREBASE_APP_ID|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_VAPID_KEY|$FIREBASE_VAPID_KEY|g" index.html firebase-messaging-sw.js
          sed -i "s|PASTE_GAS_URL|$GAS_URL|g" index.html firebase-messaging-sw.js
          echo "✅ Injection done"
          grep -c "PASTE_" index.html && echo "❌ Placeholders still found!" && exit 1 || echo "✅ No placeholders remaining"
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_VAPID_KEY:           ${{ secrets.FIREBASE_VAPID_KEY }}
          GAS_URL:                      ${{ secrets.GAS_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
