<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll Orders — Enable Notifications</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f; color: #f0ede8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2e2e2e;
      border-radius: 16px; padding: 36px;
      max-width: 440px; width: 100%; text-align: center;
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #f59e0b; }
    p  { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
    select, input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      background: #242424; border: 1px solid #2e2e2e;
      border-radius: 8px; color: #f0ede8; font-size: 14px;
    }
    .btn {
      background: #f59e0b; color: #000; border: none;
      border-radius: 10px; padding: 14px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      width: 100%; margin-bottom: 12px; transition: background .2s;
    }
    .btn:hover:not(:disabled) { background: #fbbf24; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 13px; display: none; text-align: left;
      line-height: 1.6; white-space: pre-line;
    }
    .success { background: rgba(34,197,94,.15);  color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
    .error   { background: rgba(239,68,68,.15);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .info    { background: rgba(96,165,250,.15); color: #60a5fa; border: 1px solid rgba(96,165,250,.3); }
    .warn    { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.3); }
    .ios-note {
      margin-bottom: 16px; padding: 12px 14px;
      background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.2);
      border-radius: 8px; font-size: 12px; color: #f59e0b;
      text-align: left; line-height: 1.6; display: none;
    }
    .platform-badge {
      display: inline-block; background: #242424; border: 1px solid #2e2e2e;
      border-radius: 20px; padding: 4px 12px; font-size: 11px;
      color: #6b7280; margin-bottom: 16px;
    }
    label { display: block; font-size: 11px; text-align: left;
            color: #6b7280; margin-bottom: 4px; text-transform: uppercase;
            letter-spacing: 0.08em; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">⬡</div>
  <h1>Roll Orders Alerts</h1>
  <div class="platform-badge" id="platform-badge">Detecting…</div>
  <p>Enter your email and enable notifications to receive instant order alerts on this device.</p>

  <div class="ios-note" id="ios-note">
    📱 <strong>iPhone/iPad:</strong> First tap Share ⎋ → <strong>Add to Home Screen</strong>, then reopen and enable.
  </div>

  <label>Your Email</label>
  <input type="email" id="email-input" placeholder="you@example.com" />

  <button class="btn" id="enable-btn" onclick="enableNotifications()">
    🔔 Enable Notifications
  </button>

  <div class="status" id="status-box"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey            : 'PASTE_API_KEY',
  authDomain        : 'PASTE_AUTH_DOMAIN',
  projectId         : 'PASTE_PROJECT_ID',
  storageBucket     : 'PASTE_STORAGE_BUCKET',
  messagingSenderId : 'PASTE_SENDER_ID',
  appId             : 'PASTE_APP_ID'
};
const VAPID_KEY      = 'PASTE_VAPID_KEY';
// ← Your Roll Orders Apps Script deployed URL
const SAVE_TOKEN_URL = 'PASTE_YOUR_GAS_DEPLOYED_URL';

// Detect platform
const ua         = navigator.userAgent;
const isIOS      = /iphone|ipad|ipod/i.test(ua);
const isAndroid  = /android/i.test(ua);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;

document.getElementById('platform-badge').textContent =
  isIOS ? (isStandalone ? 'iOS — Installed ✓' : 'iOS Safari')
  : isAndroid ? 'Android' : 'Desktop';

if (isIOS && !isStandalone) {
  document.getElementById('ios-note').style.display = 'block';
}

if (!('Notification' in window) || !('serviceWorker' in navigator)) {
  document.getElementById('enable-btn').disabled = true;
  showStatus('error', isIOS && !isStandalone
    ? '❌ Add to Home Screen first (see above).'
    : '❌ Push notifications not supported on this browser.'
  );
}

firebase.initializeApp(FIREBASE_CONFIG);
const messaging = firebase.messaging();

navigator.serviceWorker.register('firebase-messaging-sw.js')
  .then(reg => console.log('✅ SW registered:', reg.scope))
  .catch(err => showStatus('error', '❌ Service Worker failed: ' + err.message));

async function enableNotifications() {
  const btn   = document.getElementById('enable-btn');
  const email = document.getElementById('email-input').value.trim().toLowerCase();

  if (!email || !email.includes('@')) {
    showStatus('error', '❌ Please enter a valid email address.');
    return;
  }

  // Check this email is a valid Roll Orders user
  const validEmails = [
    'mis.ajmerind@gmail.com',
    'ajmerind@gmail.com',
    'bsr7.ajmerind@gmail.com',         // Mahender — Check Stock
    'dispatch.ajmerind@gmail.com',      // Ashok — Update/Dispatch/Delivery/Other
    'press.ajmerind@gmail.com',         // Pawan — Production
    'purchase.ajmerind1@gmail.com',     // Prakash — Material Send
    'office.ajmerind@gmail.com'         // Rajini — Confirm Buyer
  ];
  if (validEmails.indexOf(email) === -1) {
    showStatus('error', '❌ This email is not registered in Roll Orders.');
    return;
  }

  if (isIOS && !isStandalone) {
    showStatus('warn', '📱 Please add this page to your Home Screen first, then reopen and tap Enable.');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Setting up…';
  showStatus('info', '⏳ Requesting notification permission…');

  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      showStatus('error',
        '❌ Permission denied.\n\nAndroid: Tap 🔒 in address bar → Notifications → Allow.\niPhone: Settings → Safari → this site → Notifications → Allow.'
      );
      btn.disabled = false; btn.textContent = '🔔 Enable Notifications';
      return;
    }

    showStatus('info', '⏳ Getting device token…');
    const swReg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });

    if (!token) {
      showStatus('error', '❌ Could not get FCM token. Ensure the site is on HTTPS.');
      btn.disabled = false; btn.textContent = '🔔 Enable Notifications';
      return;
    }

    showStatus('info', '⏳ Saving to server…');
    const url = SAVE_TOKEN_URL + '?action=saveToken&email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token);
    await fetch(url, { method: 'GET', mode: 'no-cors' });

    showStatus('success', '✅ Done! You will now receive Roll Orders notifications on this device.\n\nEmail: ' + email);
    btn.textContent = '✅ Notifications Active';

  } catch(err) {
    showStatus('error', '❌ ' + err.message);
    btn.disabled = false; btn.textContent = '🔔 Enable Notifications';
  }
}

messaging.onMessage(payload => {
  const n = payload.notification;
  if (Notification.permission === 'granted' && n) {
    new Notification(n.title, { body: n.body, icon: 'https://i.imgur.com/8vPMBhQ.png' });
  }
});

function showStatus(type, msg) {
  const el = document.getElementById('status-box');
  el.className = 'status ' + type;
  el.style.display = 'block';
  el.textContent = msg;
}
</script>
</body>
</html>
